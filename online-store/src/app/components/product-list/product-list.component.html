<app-product-categories (categoryChange)="onCategoryChange($event)"></app-product-categories>
<div class="wrap">
<div class="product-grid">
  <app-product-card *ngFor="let product of filteredProducts" [product]="product" (liked)="likeProduct($event)" (deleted)="deleteProduct($event)"></app-product-card>
</div>
</div>
